services:
  app:
    build: .
    image: oulad-app:latest
    container_name: oulad-app
    env_file: .env
    volumes:
      - ./:/work            # code + data/ + secrets/ gắn thẳng từ máy vào container
    ports:
      - "8501:8501"         # Streamlit
      - "4040:4040"         # Spark UI khi đang chạy job
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: oulad-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oulad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oulad}
      POSTGRES_DB: ${POSTGRES_DB:-oulad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oulad} -d ${POSTGRES_DB:-oulad}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
