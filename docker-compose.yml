services:
  app:
    build: .
    image: oulad-app:latest
    container_name: oulad-app
    env_file: .env
    volumes:
      - ./:/work            # code + data/ + secrets/ gắn thẳng từ máy vào container
    ports:
      - "8501:8501"         # Streamlit
      - "4040:4040"         # Spark UI khi đang chạy job
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: oulad-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oulad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oulad}
      POSTGRES_DB: ${POSTGRES_DB:-oulad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oulad} -d ${POSTGRES_DB:-oulad}"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.8.1
    container_name: oulad-kafka
    profiles: ["stream"]          # chỉ chạy khi gọi --profile stream
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft: không cần ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  pgdata:
